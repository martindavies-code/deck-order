    <meta name="referrer" content="no-referrer" />
    <title>Deck Order — Spotify Playlist DJ Sequencer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2'><circle cx='12' cy='12' r='10'/><circle cx='12' cy='12' r='3'/></svg>" />

  <body class="bg-[#0b0d14] text-slate-100 antialiased selection:bg-emerald-500 selection:text-black">

           React on mount. Doubles as the source-HTML provider backlink that
           GetSongBPM's API terms require (their checker reads raw HTML, which
           a client-rendered footer never appears in). Keep in sync with the
           footer credits in client/src/App.jsx. -->
      <p style="position:absolute;bottom:1rem;width:100%;text-align:center;font-size:11px;color:#7E8876;font-family:sans-serif;">
        BPM and musical key data verified via
        <a href="https://getsongbpm.com" style="color:#BAC2B3;">GetSongBPM</a>
        and
        <a href="https://sonovault.now" style="color:#BAC2B3;">Sonovault</a>
        where configured, or supplied by you.
      </p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
